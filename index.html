<style>
:root{--bg:#F2F2F7;--cell:#fff;--label:#000;--label2:rgba(60,60,67,.6);--tint:#007AFF;--red:#FF3B30;--fill:rgba(118,118,128,.12);color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#000;--cell:#1C1C1E;--label:#fff;--label2:rgba(235,235,245,.6);--tint:#0A84FF;--red:#FF453A;--fill:rgba(118,118,128,.24);color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--label);font:400 17px/22px -apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased;display:grid;place-items:center;padding:env(safe-area-inset-top,0) 24px env(safe-area-inset-bottom,0)}
form{width:100%;max-width:340px;text-align:center}
img{width:76px;height:76px;border-radius:17px;box-shadow:0 2px 10px rgba(0,0,0,.12)}
h1{font:700 28px/34px -apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif;margin:18px 0 6px}
p{margin:0 0 22px;color:var(--label2);font-size:15px;line-height:20px}
input{width:100%;font:inherit;border:0;border-radius:10px;background:var(--cell);color:var(--label);padding:12px 16px;outline:none}
input:focus{box-shadow:0 0 0 3px color-mix(in srgb,var(--tint) 40%,transparent)}
button{width:100%;margin-top:12px;border:0;border-radius:12px;background:var(--tint);color:#fff;font:600 17px/22px inherit;font-family:inherit;padding:13px}
button:disabled{opacity:.5}
.err{color:var(--red);font-size:13px;min-height:18px;margin-top:10px}
.shake{animation:sh .35s}@keyframes sh{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
</style>
</head>

var KEY='trip-unlock-v1';
var subtle=window.crypto&&crypto.subtle;
function b64(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
function toB64(buf){var u=new Uint8Array(buf),s='';for(var i=0;i<u.length;i++)s+=String.fromCharCode(u[i]);return btoa(s)}
if('serviceWorker' in navigator&&window.isSecureContext){navigator.serviceWorker.register('sw.js').catch(function(){})}
function open(key){
  return subtle.decrypt({name:'AES-GCM',iv:b64(DATA.iv)},key,b64(DATA.ct)).then(function(pt){
    var html=new TextDecoder().decode(pt);
    document.open();document.write(html);document.close();
  });
}
function derive(pw){
  return subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']).then(function(base){
    return subtle.deriveKey({name:'PBKDF2',salt:b64(DATA.salt),iterations:DATA.iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},true,['decrypt']);
  });
}
function showForm(){
  var f=document.getElementById('f'),pw=document.getElementById('pw'),err=document.getElementById('err'),go=document.getElementById('go');
  f.hidden=false;pw.focus();
  f.addEventListener('submit',function(e){
    e.preventDefault(); if(!pw.value) return;
    go.disabled=true; go.textContent='Opening…'; err.textContent='';
    var key;
    derive(pw.value).then(function(k){key=k;return subtle.decrypt({name:'AES-GCM',iv:b64(DATA.iv)},k,b64(DATA.ct))}).then(function(){
      return subtle.exportKey('raw',key).then(function(raw){try{localStorage.setItem(KEY,JSON.stringify({salt:DATA.salt,k:toB64(raw)}))}catch(e){}}).then(function(){return open(key)});
    }).catch(function(){
      go.disabled=false; go.textContent='Open'; err.textContent='That password didn’t work.';
      f.classList.remove('shake'); void f.offsetWidth; f.classList.add('shake'); pw.select();
    });
  });
}
if(!subtle){document.body.textContent='This browser can’t open the trip. Use Safari.';return}
var saved=null; try{saved=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){}
if(saved&&saved.salt===DATA.salt){
  subtle.importKey('raw',b64(saved.k),'AES-GCM',false,['decrypt']).then(open).catch(function(){try{localStorage.removeItem(KEY)}catch(e){}showForm()});
